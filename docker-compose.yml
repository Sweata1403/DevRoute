services:
  # ── Your API ───────────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      target: production
    container_name: devroute-api
    restart: unless-stopped
    ports:
      - "3000:3000" # host:container — visit localhost:3000
    environment:
      NODE_ENV: development
      PORT: 3000
      BASE_URL: http://localhost:3000
      POSTGRES_HOST: postgres # 'postgres' = the service name below, not localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: devroute
      POSTGRES_USER: devroute
      POSTGRES_PASSWORD: devroute_secret
      REDIS_HOST: redis # 'redis' = the service name below
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy # wait until Postgres is ready before starting API
      redis:
        condition: service_healthy
    networks:
      - devroute-net

  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: devroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devroute
      POSTGRES_USER: devroute
      POSTGRES_PASSWORD: devroute_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data # data persists across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devroute -d devroute"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devroute-net

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devroute-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - devroute-net

# Named volumes — Docker manages these, data survives container restarts
volumes:
  postgres-data:
  redis-data:

# Isolated network — containers talk to each other by service name
networks:
  devroute-net:
    driver: bridge
