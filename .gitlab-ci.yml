image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: devroute-api
  ECR_REGISTRY: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}

stages:
  - build
  - test
  - scan
  - push

# ── Build ────────────────────────────────────────────────────────────────────
build:
  stage: build
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} services/api/
    - docker save ${IMAGE_NAME}:${IMAGE_TAG} | gzip > image.tar.gz
  artifacts:
    paths:
      - image.tar.gz
    expire_in: 1 hour
  only:
    - main
    - merge_requests

# ── Integration Test ─────────────────────────────────────────────────────────
integration-test:
  stage: test
  image: node:20-alpine
  services:
    - name: postgres:15-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: devroute_test
    POSTGRES_USER: devroute
    POSTGRES_PASSWORD: testpassword
    NODE_ENV: test
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: devroute_test
    DB_USER: devroute
    DB_PASSWORD: testpassword
    REDIS_URL: redis://redis:6379
  script:
    - cd services/api
    - npm ci
    - npm test
  only:
    - main
    - merge_requests

# ── Trivy Scan ───────────────────────────────────────────────────────────────
trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - gunzip -c image.tar.gz > image.tar
    - trivy image
      --exit-code 1
      --severity HIGH,CRITICAL
      --no-progress
      --input image.tar
  artifacts:
    when: always
    reports:
      container_scanning: trivy-report.json
    paths:
      - trivy-report.json
  after_script:
    - trivy image
      --format template
      --template "@/contrib/gitlab.tpl"
      --output trivy-report.json
      --input image.tar || true
  only:
    - main

# ── Push to ECR ──────────────────────────────────────────────────────────────
push-to-ecr:
  stage: push
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - aws --version
    - aws ecr get-login-password --region ${AWS_REGION} |
      docker login --username AWS --password-stdin ${ECR_REGISTRY}
  script:
    - gunzip -c image.tar.gz | docker load
    - docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    - docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${ECR_REGISTRY}/${IMAGE_NAME}:latest
    - docker push ${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${ECR_REGISTRY}/${IMAGE_NAME}:latest
    - echo "IMAGE_TAG=${IMAGE_TAG}" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  only:
    - main
  needs:
    - job: build
      artifacts: true
    - job: trivy-scan
