image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: devroute-api
  ECR_REGISTRY: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}

stages:
  - build
  - test
  - scan
  - push
  - deploy

# ── Build ────────────────────────────────────────────────────────────────────
build:
  stage: build
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} services/api/
    - docker save ${IMAGE_NAME}:${IMAGE_TAG} | gzip > image.tar.gz
  artifacts:
    paths:
      - image.tar.gz
    expire_in: 1 hour
  only:
    - main
    - merge_requests

# ── Integration Test ─────────────────────────────────────────────────────────
integration-test:
  stage: test
  image: node:20-alpine
  services:
    - name: postgres:15-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: devroute_test
    POSTGRES_USER: devroute
    POSTGRES_PASSWORD: testpassword
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    NODE_ENV: test
    REDIS_URL: redis://redis:6379
    JWT_SECRET: test-secret-for-ci
  script:
    - cd services/api
    - npm ci
    - node -e "require('./src/db/postgres').runMigrations().then(() => { console.log('Migrations done'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); })"
    - npm test
  only:
    - main
    - merge_requests

# ── Trivy Scan ───────────────────────────────────────────────────────────────
trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - gunzip -c image.tar.gz > image.tar
    - trivy image
      --exit-code 1
      --severity HIGH,CRITICAL
      --no-progress
      --input image.tar
  artifacts:
    when: always
    reports:
      container_scanning: trivy-report.json
    paths:
      - trivy-report.json
  after_script:
    - trivy image
      --format template
      --template "@/contrib/gitlab.tpl"
      --output trivy-report.json
      --input image.tar || true
  only:
    - main

# ── Push to ECR ──────────────────────────────────────────────────────────────
push-to-ecr:
  stage: push
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - aws --version
    - aws ecr get-login-password --region ${AWS_REGION} |
      docker login --username AWS --password-stdin ${ECR_REGISTRY}
  script:
    - gunzip -c image.tar.gz | docker load
    - docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    - docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${ECR_REGISTRY}/${IMAGE_NAME}:latest
    - docker push ${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${ECR_REGISTRY}/${IMAGE_NAME}:latest
    - echo "IMAGE_TAG=${IMAGE_TAG}" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  only:
    - main
  needs:
    - job: build
      artifacts: true
    - job: trivy-scan

# ── Deployment Preview Link ───────────────────────────────────────────────────
preview-link:
  stage: deploy
  image: curlimages/curl:latest
  needs:
    - job: push-to-ecr
      artifacts: true
  when: on_success
  variables:
    DEVROUTE_API_URL: "http://your-ec2-ip:3000"
    DEVROUTE_API_TOKEN: $DEVROUTE_API_TOKEN
  script:
    - |
      echo "Creating deployment preview link..."

      RESPONSE=$(curl -s -X POST "${DEVROUTE_API_URL}/api/links" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer ${DEVROUTE_API_TOKEN}" \
        -d "{
          \"url\": \"${DEVROUTE_API_URL}\",
          \"alias\": \"deploy-${CI_COMMIT_SHORT_SHA}\"
        }")

      echo "API Response: $RESPONSE"

      SHORT_CODE=$(echo "$RESPONSE" | grep -o '"code":"[^"]*"' | cut -d'"' -f4)
      SHORT_URL="${DEVROUTE_API_URL}/${SHORT_CODE}"

      echo ""
      echo "========================================="
      echo "  Deployment Preview Link"
      echo "  $SHORT_URL"
      echo "  Commit: $CI_COMMIT_SHORT_SHA"
      echo "  Branch: $CI_COMMIT_BRANCH"
      echo "  Pipeline: $CI_PIPELINE_URL"
      echo "========================================="
  environment:
    name: preview/$CI_COMMIT_SHORT_SHA
    url: $DEVROUTE_API_URL/deploy-$CI_COMMIT_SHORT_SHA
  only:
    - main

