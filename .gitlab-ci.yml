stages:
  - build
  - test
  - push
  - staging
  - production

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $ECR_REGISTRY/devroute:$IMAGE_TAG ./services/api
    - docker save $ECR_REGISTRY/devroute:$IMAGE_TAG > image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

test:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build --target test -t devroute-test ./services/api
    - docker network create test-net-$IMAGE_TAG
    - |
      docker run -d --name pg-$IMAGE_TAG \
        --network test-net-$IMAGE_TAG \
        -e POSTGRES_DB=devroute_test \
        -e POSTGRES_USER=devroute \
        -e POSTGRES_PASSWORD=devroute \
        postgres:15-alpine
    - docker run -d --name redis-$IMAGE_TAG --network test-net-$IMAGE_TAG redis:7-alpine
    - sleep 5
    - |
      docker run --rm \
        --network test-net-$IMAGE_TAG \
        -e POSTGRES_HOST=pg-$IMAGE_TAG \
        -e POSTGRES_PORT=5432 \
        -e POSTGRES_DB=devroute_test \
        -e POSTGRES_USER=devroute \
        -e POSTGRES_PASSWORD=devroute \
        -e REDIS_HOST=redis-$IMAGE_TAG \
        -e REDIS_PORT=6379 \
        -e JWT_SECRET=test-secret \
        -e NODE_ENV=test \
        devroute-test
  after_script:
    - docker rm -f pg-$IMAGE_TAG redis-$IMAGE_TAG || true
    - docker network rm test-net-$IMAGE_TAG || true

push:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache aws-cli
    - aws --version
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - docker load < image.tar
    - docker push $ECR_REGISTRY/devroute:$IMAGE_TAG
  dependencies:
    - build

deploy_staging:
  stage: staging
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 400 $EC2_SSH_KEY
    - ssh-add $EC2_SSH_KEY
  script:
    - |
      ssh -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY &&
        docker pull $ECR_REGISTRY/devroute:$IMAGE_TAG &&
        docker stop devroute-staging || true &&
        docker rm devroute-staging || true &&
        docker run -d --name devroute-staging -p 3001:3000 \
          --env-file /home/ubuntu/devroute.env \
          -e NODE_ENV=staging \
          $ECR_REGISTRY/devroute:$IMAGE_TAG &&
        sleep 5 &&
        curl -f http://localhost:3001/health
      "
  dependencies: []

deploy_production:
  stage: production
  when: manual
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 400 $EC2_SSH_KEY
    - ssh-add $EC2_SSH_KEY
  script:
    - |
      ssh -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY &&
        docker pull $ECR_REGISTRY/devroute:$IMAGE_TAG &&
        docker stop devroute-prod || true &&
        docker rm devroute-prod || true &&
        docker run -d --name devroute-prod -p 3000:3000 \
          --env-file /home/ubuntu/devroute.env \
          -e NODE_ENV=production \
          $ECR_REGISTRY/devroute:$IMAGE_TAG &&
        sleep 5 &&
        curl -f http://localhost:3000/health
      "
  dependencies: []

