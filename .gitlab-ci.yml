image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: devroute-api
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}

stages:
  - build
  - test
  - scan
  - push
  - deploy

# ── Build ────────────────────────────────────────────────────────────────────
build:
  stage: build
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} services/api/
    - docker save ${IMAGE_NAME}:${IMAGE_TAG} | gzip > image.tar.gz
  artifacts:
    paths:
      - image.tar.gz
    expire_in: 1 hour
  only:
    - main
    - merge_requests

# ── Integration Test ─────────────────────────────────────────────────────────
integration-test:
  stage: test
  image: node:20-alpine
  services:
    - name: postgres:15-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: devroute_test
    POSTGRES_USER: devroute
    POSTGRES_PASSWORD: testpassword
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    NODE_ENV: test
    REDIS_URL: redis://redis:6379
    JWT_SECRET: test-secret-for-ci
  script:
    - cd services/api
    - npm ci
    - node -e "require('./src/db/postgres').runMigrations().then(() => { console.log('Migrations done'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); })"
    - npm test
  only:
    - main
    - merge_requests

# ── Trivy Scan ───────────────────────────────────────────────────────────────
trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - gunzip -c image.tar.gz > image.tar
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress --skip-dirs /usr/local/lib/node_modules/npm --ignorefile .trivyignore --input image.tar
  artifacts:
    when: always
    reports:
      container_scanning: trivy-report.json
    paths:
      - trivy-report.json
  after_script:
    - trivy image --format template --template "@/contrib/gitlab.tpl" --output trivy-report.json --input image.tar || true
  only:
    - main

# ── Push to ECR ──────────────────────────────────────────────────────────────
push-to-ecr:
  stage: push
  image: python:3.12-slim
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io curl unzip
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip -q awscliv2.zip
    - ./aws/install
    - aws --version
    - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
  script:
    - gunzip -c image.tar.gz | docker load
    - docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    - docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${ECR_REGISTRY}/${IMAGE_NAME}:latest
    - docker push ${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${ECR_REGISTRY}/${IMAGE_NAME}:latest
    - echo "IMAGE_TAG=${IMAGE_TAG}" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  only:
    - main
  needs:
    - job: build
      artifacts: true
    - job: trivy-scan

# ── Deployment Preview Link ───────────────────────────────────────────────────
deploy-to-ec2:
  stage: deploy
  image: alpine:latest
  needs:
    - job: push-to-ecr
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client aws-cli
    - mkdir -p ~/.ssh
    - cp $EC2_SSH_KEY ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ${EC2_HOST} >> ~/.ssh/known_hosts
  script:
    - |
      ssh -i ~/.ssh/id_rsa ubuntu@${EC2_HOST} "
        aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
        docker pull ${ECR_REGISTRY}/${IMAGE_NAME}:latest
        docker stop devroute-api || true
        docker rm devroute-api || true
        docker run -d --name devroute-api --restart unless-stopped -p 3000:3000 ${ECR_REGISTRY}/${IMAGE_NAME}:latest
        echo 'Deployment complete'
      "
  only:
    - main

